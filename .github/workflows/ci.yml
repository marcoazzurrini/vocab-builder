name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2
      - run: bun install --frozen-lockfile
      - run: bun run ci
      - name: Authentication coverage with reproducible randomized order
        run: bun run --filter @vocab/authentication test:coverage --randomize --seed ${{ github.run_number }}
      - uses: actions/upload-artifact@v4
        with:
          name: authentication-coverage
          path: packages/authentication/coverage/lcov.info
          if-no-files-found: error
      - name: Core coverage with reproducible randomized order
        run: bun run --filter @vocab/spaced-repetition test:coverage --randomize --seed ${{ github.run_number }}
      - uses: actions/upload-artifact@v4
        with:
          name: spaced-repetition-coverage
          path: packages/spaced-repetition/coverage/lcov.info
          if-no-files-found: error
